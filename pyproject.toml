[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-registry"
version = "0.3.0"
description = "Unified detection, configuration, and chat discovery registry for AI coding agent CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mark Stouffer", email = "1802850+InTEGr8or@users.noreply.github.com" }
]
dependencies = [
    "verkit>=0.1.4",
    "rich>=13.9.4",
]

[project.scripts]
multi-agent-registry = "multi_agent_registry.cli:main"
mar = "multi_agent_registry.cli:main"

[tool.hatch.build]
exclude = [
    "docs/",
    ".task-agent/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_registry"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
